<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#16120E" />
    <link rel="icon" type="image/svg+xml" href="./icons/mark.svg" />
    <title>Needs Me CEO</title>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("./fonts/SpaceGrotesk-Variable.ttf") format("truetype"); font-weight: 300 700; font-display: swap; }
      @font-face { font-family: "IBM Plex Sans"; src: url("./fonts/IBMPlexSans-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
      @font-face { font-family: "IBM Plex Mono"; src: url("./fonts/IBMPlexMono-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
      :root {
        --loam: #16120E; --surface: #221C16; --surface2: #2A231B; --hairline: #38302A;
        --sprout: #A8C256; --tint: #C6D98F; --bone: #F0EAE0; --ink: #F0EAE0;
        --muted: #A79C8C; --deep: #56702B;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--loam); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; }
      h1, h2, h3 { font-family: "Space Grotesk", sans-serif; font-weight: 600; }
      header.top { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--hairline); }
      header.top img { width: 34px; height: 34px; }
      header.top h1 { font-size: 21px; margin: 0; }
      header.top .who { margin-left: auto; font-size: 13px; color: var(--muted); font-family: "IBM Plex Mono", monospace; }
      main { max-width: 1060px; margin: 0 auto; padding: 8px 20px 60px; }
      .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; padding: 16px 18px; margin: 12px 0; }
      .num { font-family: "Space Grotesk", sans-serif; font-size: 32px; font-weight: 700; color: var(--bone); }
      .num .unit { font-size: 15px; color: var(--muted); font-weight: 500; }
      .lbl { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
      .layout { display: grid; grid-template-columns: 200px 1fr; gap: 16px; align-items: start; }
      @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
      nav.side { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
      nav.side button { text-align: left; border: 1px solid var(--hairline); background: var(--surface); border-radius: 10px; padding: 10px 12px; font: inherit; font-weight: 600; cursor: pointer; color: var(--ink); }
      nav.side button.on { background: var(--sprout); color: #16120E; border-color: var(--sprout); }
      button.act { border: 0; background: var(--sprout); color: #16120E; border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 700; cursor: pointer; }
      button.ghost { border: 1px solid var(--hairline); background: var(--surface2); color: var(--ink); border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; }
      input { width: 100%; border: 1px solid var(--hairline); border-radius: 10px; padding: 10px 12px; font: inherit; background: var(--loam); color: var(--ink); }
      label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 14px; }
      table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
      th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--hairline); }
      th { color: var(--muted); font-weight: 600; font-size: 13px; }
      .hint { color: var(--muted); font-size: 14px; }
      .msg { color: var(--tint); font-weight: 600; font-size: 14px; min-height: 1.2em; }
      .tag { display: inline-block; border: 1px solid var(--hairline); border-radius: 999px; padding: 1px 9px; font-size: 12.5px; color: var(--tint); font-family: "IBM Plex Mono", monospace; }
      .feed-item { padding: 9px 0; border-bottom: 1px solid var(--hairline); font-size: 14.5px; }
      .feed-item:last-child { border-bottom: 0; }
      .feed-item .when { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
      [hidden] { display: none !important; }
    </style>
    <script type="module" crossorigin src="./assets/index-vZ-vAezS.js"></script>
  </head>
  <body>
    <header class="top">
      <img src="./icons/mark.svg" alt="" />
      <h1>Needs Me CEO</h1>
      <span class="who" id="whoLine"></span>
    </header>
    <main id="ownerRoot"></main>
  </body>
</html>
